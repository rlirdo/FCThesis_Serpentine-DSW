<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 132" role="img" aria-label="泡泡 Mimi">
  <title>泡泡 Mimi — 微胞泡泡精靈（本專案自繪）</title>
  <defs>
    <radialGradient id="mbody" cx="38%" cy="32%" r="72%">
      <stop offset="0" stop-color="#EAF8FC"/>
      <stop offset="0.55" stop-color="#8FD4E8"/>
      <stop offset="1" stop-color="#1C7293"/>
    </radialGradient>
    <radialGradient id="mcore" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#F6E3BC"/><stop offset="1" stop-color="#C99A3E"/>
    </radialGradient>
  </defs>

  <!-- 疏水小尾巴（朝內／朝下捲曲） -->
  <path d="M60 108 q-4 12 -14 15 q10 4 16 -3" fill="none" stroke="#C99A3E" stroke-width="6" stroke-linecap="round"/>
  <path d="M60 108 q6 12 17 13" fill="none" stroke="#C99A3E" stroke-width="5" stroke-linecap="round"/>

  <!-- 親水頭髮（PEG 觸鬚，朝外舒展） -->
  <g stroke="#5FA98A" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M60 22 q-3 -14 -12 -18"/>
    <path d="M60 22 q3 -15 13 -17"/>
    <path d="M40 32 q-11 -9 -21 -8"/>
    <path d="M80 32 q11 -9 21 -7"/>
  </g>
  <g fill="#5FA98A">
    <circle cx="46" cy="3" r="4.5"/><circle cx="74" cy="4" r="4.5"/>
    <circle cx="18" cy="23" r="4.5"/><circle cx="102" cy="24" r="4.5"/>
  </g>

  <!-- 泡泡本體 -->
  <circle cx="60" cy="66" r="42" fill="url(#mbody)" stroke="#0B1F3A" stroke-width="3"/>
  <circle cx="60" cy="66" r="20" fill="url(#mcore)" opacity="0.85"/>
  <circle cx="45" cy="50" r="9" fill="#FFFFFF" opacity="0.75"/>
  <circle cx="52" cy="42" r="4" fill="#FFFFFF" opacity="0.9"/>

  <!-- 表面的親水／親油分子小記號 -->
  <g stroke="#0B1F3A" stroke-width="2" opacity="0.35">
    <path d="M60 24 v10"/><path d="M96 60 h-10"/><path d="M60 108 v-10"/><path d="M24 60 h10"/>
  </g>

  <!-- 臉 -->
  <ellipse cx="47" cy="62" rx="5.4" ry="6.6" fill="#0B1F3A"/>
  <ellipse cx="73" cy="62" rx="5.4" ry="6.6" fill="#0B1F3A"/>
  <circle cx="48.8" cy="59.6" r="2" fill="#fff"/><circle cx="74.8" cy="59.6" r="2" fill="#fff"/>
  <path d="M52 77 q8 8 16 0" fill="none" stroke="#0B1F3A" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="36" cy="74" rx="6" ry="4" fill="#F19A9A" opacity="0.6"/>
  <ellipse cx="84" cy="74" rx="6" ry="4" fill="#F19A9A" opacity="0.6"/>
</svg>
