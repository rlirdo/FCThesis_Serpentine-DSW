<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 132" role="img" aria-label="水滴 Aqua">
  <title>水滴 Aqua — 氫鍵水精靈（本專案自繪）</title>
  <defs>
    <linearGradient id="abody" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#BFEAF7"/>
      <stop offset="0.45" stop-color="#78C4E4"/>
      <stop offset="1" stop-color="#065A82"/>
    </linearGradient>
  </defs>

  <!-- 氫鍵小天線 -->
  <g stroke="#C99A3E" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="4 4" fill="none">
    <path d="M48 26 q-8 -14 -16 -18"/>
    <path d="M72 26 q8 -14 16 -18"/>
  </g>
  <circle cx="31" cy="7" r="6" fill="#DDE6EA" stroke="#0B1F3A" stroke-width="2.2"/>
  <circle cx="89" cy="7" r="6" fill="#DDE6EA" stroke="#0B1F3A" stroke-width="2.2"/>
  <text x="31" y="10" font-size="7" font-weight="700" text-anchor="middle" fill="#0B1F3A"
        font-family="Microsoft JhengHei, sans-serif">H</text>
  <text x="89" y="10" font-size="7" font-weight="700" text-anchor="middle" fill="#0B1F3A"
        font-family="Microsoft JhengHei, sans-serif">H</text>

  <!-- 水滴本體 -->
  <path d="M60 20 C 88 52, 102 68, 102 84 A 42 42 0 1 1 18 84 C 18 68, 32 52, 60 20 Z"
        fill="url(#abody)" stroke="#0B1F3A" stroke-width="3"/>

  <!-- 極性標示 δ− / δ+ -->
  <text x="60" y="46" font-size="11" font-weight="700" text-anchor="middle" fill="#0B1F3A"
        font-family="Microsoft JhengHei, sans-serif" opacity="0.7">δ−</text>
  <text x="30" y="104" font-size="10" font-weight="700" text-anchor="middle" fill="#F4FAFD"
        font-family="Microsoft JhengHei, sans-serif" opacity="0.85">δ+</text>
  <text x="90" y="104" font-size="10" font-weight="700" text-anchor="middle" fill="#F4FAFD"
        font-family="Microsoft JhengHei, sans-serif" opacity="0.85">δ+</text>

  <!-- 高光 -->
  <ellipse cx="44" cy="60" rx="9" ry="13" fill="#FFFFFF" opacity="0.45" transform="rotate(-18 44 60)"/>
  <circle cx="52" cy="46" r="3.4" fill="#FFFFFF" opacity="0.8"/>

  <!-- 臉 -->
  <ellipse cx="48" cy="80" rx="5.6" ry="7" fill="#0B1F3A"/>
  <ellipse cx="74" cy="80" rx="5.6" ry="7" fill="#0B1F3A"/>
  <circle cx="49.8" cy="77.4" r="2.1" fill="#fff"/><circle cx="75.8" cy="77.4" r="2.1" fill="#fff"/>
  <path d="M53 94 q8 9 17 0" fill="none" stroke="#0B1F3A" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="36" cy="90" rx="6" ry="4" fill="#F19A9A" opacity="0.5"/>
  <ellipse cx="86" cy="90" rx="6" ry="4" fill="#F19A9A" opacity="0.5"/>
</svg>
